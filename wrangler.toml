name = "poker-online-multiplayer-game"
main = "worker.js"
compatibility_date = "2024-11-01"

# Durable Object שמחזיק את מצב שולחן הפוקר (שחקנים, קלפים, קופה, סבבי הימורים)
[[durable_objects.bindings]]
name = "POKER_TABLE"
class_name = "PokerTable"

# בתוכנית Free, Durable Objects חייבים מיגרציה מגובה-SQLite (new_sqlite_classes),
# לא את new_classes הישן (זה דורש תוכנית בתשלום). ראה קוד שגיאה 10097.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PokerTable"]
